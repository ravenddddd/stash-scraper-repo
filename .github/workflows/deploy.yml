name: Deploy repository to GitHub Pages

on:
  push:
    paths:
      - 'scrapers/**'
      - 'build.ts'
      - 'lib/**'
      - 'validator/**'
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Each package's version is the last commit that touched it, so the
          # whole history has to be present for build.ts to read it.
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true
      # Re-checked here, not just in validate.yml, so a scraper that fails
      # validation can never reach the published index.
      - name: Validate scrapers
        run: deno -R -E ./validate.js --ci
      - name: Build index
        run: deno task build _site/${{ github.ref_name }}
      - uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}main/index.yml
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
