name: DLsite (ravend)
sceneByFragment:
  action: scrapeXPath
  # expects RJ code as the title
  queryURL: https://www.dlsite.com/maniax/work/=/product_id/{title}.html
  #queryURL: https://www.dlsite.com/maniax/work/=/product_id/{title}.html/?locale=en_US
  scraper: sceneScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - dlsite.com/maniax/work/
      - dlsite.com/bl-pro/work/
    scraper: sceneScraper
    queryURL: "{url}"
sceneByName:
  action: scrapeXPath
  queryURL: https://www.dlsite.com/maniax/fsr/=/language/jp/sex_category%5B0%5D/male/keyword/{}/order%5B0%5D/trend/per_page/30/from/fs.header
  scraper: sceneQueryScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  #queryURLReplace:
  #  url:
  #    - regex: $
  #      with: "/?locale=en_US"
  scraper: sceneScraper
galleryByFragment:
  action: scrapeXPath
  queryURL: https://www.dlsite.com/maniax/work/=/product_id/{title}.html
  #queryURL: https://www.dlsite.com/maniax/work/=/product_id/{title}.html/?locale=en_US
  scraper: galleryManiaxScraper
galleryByURL:
  - action: scrapeXPath
    url:
      - dlsite.com/maniax/work/
      - dlsite.com/bl-pro/work/
      - dlsite.com/girls/work/
      - dlsite.com/bl/work
      - dlsite.com/bl-touch
      - dlsite.com/pro/work
    scraper: galleryManiaxScraper
    queryURL: "{url}"
  - action: scrapeXPath
    url:
      - dlsite.com/books/work/
    scraper: galleryBookScraper
    queryURL: "{url}"

xPathScrapers:
  sceneQueryScraper:
    scene:
      Title: //dd[@class='work_name']/div[@class='multiline_truncate']/a
      URLs: //dd[@class='work_name']/div[@class='multiline_truncate']/a/@href
      # The listing markup puts the thumb inside a <thumb-with-ng-filter-block>
      # custom element; the old <a class='work_thumb_inner'><img> path no
      # longer exists. The candidates attribute lists a 240px thumb first but
      # also a full-size one, and modpub serves the full size.
      Image:
        selector: //thumb-with-ng-filter-block/@*[contains(name(), 'thumb-candidates')]
        postProcess:
          - javascript: |
              const m = /'(\/\/[^']*_img_main)_\d+x\d+\.jpg'/.exec(value);
              if (!m) return "";
              return "https:" + m[1].replace("/resize/", "/modpub/") + ".jpg";
  sceneScraper:
    scene:
      # The work page was rebuilt on a <dl> layout: every fact is a
      # <dt> label with a <dd> value beside it, and the canonical link is the
      # only URL the page still states.
      Title: &titleSel //h1[@id='work_name']
      Date: &dateSel
        selector: //dt[text()='販売日' or text()='Release date']/following-sibling::dd
        postProcess:
          - replace:
              - regex: \s.+$
                with: ""
              - regex: ^(\d{4})/(\d+)/(\d+)$
                with: "${1}年${2}月${3}日"
          - parseDate: 2006年1月2日
      Details: &detailsSel
        selector: //section[contains(@class,"c-productContent")]/*
        concat: "\n\n"
      Tags: &tagsSel
        Name: //dt[text()='ジャンル' or text()='Genre']/following-sibling::dd//a
      Performers:
        # only illustrators and voice actors, writers and musicians are not included
        Name: //dt[text()='声優' or text()='Voice Actor' or text()='イラスト' or text()='Illustration']/following-sibling::dd//a
      Studio: &studioSel
        Name: //*[contains(@class,"c-productInfo__makerName")]
      Image: //meta[@property='og:image']/@content
      URLs: &urlSel //link[@rel='canonical']/@href
  galleryManiaxScraper:
    gallery:
      Title: *titleSel
      Date: *dateSel
      Details: *detailsSel
      Tags: *tagsSel
      Code:
        selector: *urlSel
        postProcess:
          - replace:
              - regex: .*product_id/([^.]+).*
                with: $1
      # Some works carry only a 作者 row and no イラスト row, so both are read.
      # A gallery has one Photographer string, so the credits are joined rather
      # than truncated to the first.
      Photographer:
        selector: "//dt[text()='イラスト' or text()='Illustration' or text()='作者' or text()='Author']/following-sibling::dd//a"
        concat: " / "
      Studio: *studioSel
      URLs: *urlSel
  galleryBookScraper:
    gallery:
      Title: *titleSel
      # The books template has no <dt> table: its page states the product only
      # in a schema.org Product block (JSON-LD), so the description and the
      # publisher are read from there. Date and tags are not on the page at all.
      Date: *dateSel
      Details:
        selector: &productLd //script[@type='application/ld+json'][contains(text(), '"@type":"Product"')]/text()
        postProcess:
          - javascript: |
              try {
                const product = JSON.parse(value);
                return String(product.description || "").trim();
              } catch (e) {
                return "";
              }
      Tags: *tagsSel
      Code:
        selector: *urlSel
        postProcess:
          - replace:
              - regex: .*product_id/([^.]+).*
                with: $1
      # for maniax author is the writer, for books this is illustrators
      Photographer:
        selector: "//dt[text()='著者' or text()='Author']/following-sibling::dd//a"
        concat: " / "
      Studio:
        Name:
          selector: *productLd
          postProcess:
            - javascript: |
                try {
                  const product = JSON.parse(value);
                  return String(product.brand?.name || "").trim();
                } catch (e) {
                  return "";
                }
      URLs: *urlSel
