name: DMM (ravend)
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.dmm.co.jp/mono/-/search/=/searchstr={filename}/
  queryURLReplace:
    filename:
      - regex: \..+$
        with: ""
  scraper: sceneQueryScraper
sceneByURL:
  # An archived page keeps the original URL inside it
  # (https://web.archive.org/web/20190612051907/https://www.dmm.co.jp/...), so
  # this pattern already covers archived DMM pages. A bare web.archive.org/
  # entry would also match archived pages of every other site, and because
  # og:title still resolves on those it would return a non-nil result and so
  # take the URL away from whichever scraper should have handled it.
  - action: scrapeXPath
    url:
      - dmm.co.jp/
    scraper: sceneScraper
    queryURL: "{url}"
sceneByName:
  action: scrapeXPath
  queryURL: https://www.dmm.co.jp/mono/-/search/=/searchstr={}/
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  sceneSearch:
    common:
      $videoItem: //*[@id="list"]
    scene:
      Title: $videoItem/li/div/p/a/span[@class="txt"]
      URLs:
        selector: $videoItem/li/div/p/a/@href
      Image:
        selector: $videoItem/li/div/p/a/span[@class="img"]/img/@src
        postProcess:
          - replace:
              - regex: ^
                with: "https:"
  sceneQueryScraper:
    common:
      $videoItem: //*[@id="list"]
    scene:
      Title: $videoItem/li/div/p/a/span[@class="txt"]
      URLs:
        selector: $videoItem/li/div/p/a/@href
      Image:
        selector: $videoItem/li/div/p/a/span[@class="img"]/img/@src
        postProcess:
          - replace:
              - regex: ^
                with: "https:"

  sceneScraper:
    scene:
      Title: //meta[@property="og:title"]/@content
      # @id="mu" pins the one synopsis cell. The @valign="top" form this
      # replaced matches 13 cells on a mono page and relies on the descendant
      # chain below to narrow it to one; if a second cell ever grows the same
      # div/p shape, Details would silently keep only the first.
      Details: //td[@id="mu"]//div[@class="mg-b20 lh4"]/p[@class="mg-b20"]/text()
      Date:
        selector: //td[contains(.,"発売日") and @class="nw"]/following-sibling::td
        postProcess:
          - replace:
              - regex: (\d{4})/(\d{2})/(\d{2})
                with: $1-$2-$3
          - parseDate: 2006-01-02
      Code:
        selector: //td[contains(.,"品番") and @class="nw"]/following-sibling::td
        postProcess:
          - replace:
              - regex: ([a-zA-Z]+)(\d+)
                with: $1-$2
      Tags:
        Name: //td[contains(.,"ジャンル") and @class="nw"]/following-sibling::td/a
      Performers:
        Name: //td[contains(.,"出演者") and @class="nw"]/following-sibling::td/span/a
      Studio:
        Name:
          selector: //td[contains(.,"メーカー") and @class="nw"]/following-sibling::td/a
          postProcess:
            - map:
                ムゲンエンターテインメント: MUGEN Entertainment
                ケイ・エム・プロデュース: K M Produce
                オペラ: OPERA
                SODクリエイト: SOD Create
                三和出版: Sanwa Shuppan
                セレブの友: Celeb no Tomo
                AVS collector’s: AVS collector's
                クィーンロード: SmQueenRoad
                キャットウォーク: Catwalk
                ルビー: Ruby
                マキシング: Maxing
                プールクラブ・エンタテインメント: POOLCLUB ENTERTAINMENT
                レイディックス: RADIX
                エスワン ナンバーワンスタイル: S1 NO.1 STYLE
                大塚フロッピー: Otsuka Floppy
                ムーディーズ: Moodyz
                ヴィ: V
                #キチックス/妄想族: Kitixx/妄想族
                #バミューダ/妄想族: BERMUDA/妄想族
                #ボニータ/妄想族: Bonita/妄想族
                #タマネギ/妄想族: Onion/妄想族
                #ミステリア/妄想族: Mystery/妄想族

      Image: //meta[@property="og:image"]/@content
      URLs:
        selector: //meta[@property="og:url"]/@content
      Director: //td[contains(.,"監督") and @class="nw"]/following-sibling::td/a
driver:
  cookies:
    - CookieURL: "https://www.dmm.co.jp"
      Cookies:
        - Name: "age_check_done"
          Domain: ".dmm.co.jp"
          Value: "1"
          Path: "/"
